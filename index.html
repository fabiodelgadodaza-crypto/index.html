<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control de Tiempos de Natacion</title>
<style>
  body { font-family: Arial, sans-serif; background:#0a1e3f; color:#fff; margin:0; padding:16px; }
  h1 { font-size:1.3em; text-align:center; color:#c9a24a; }
  .card { background:#132c54; border-radius:10px; padding:16px; margin-bottom:16px; }
  label { display:block; margin-top:10px; font-size:0.9em; color:#cfd8e8; }
  input, select { width:100%; padding:10px; margin-top:4px; border-radius:6px; border:none; font-size:1em; box-sizing:border-box; }
  button { background:#c9a24a; color:#0a1e3f; border:none; padding:12px 18px; border-radius:8px; font-weight:bold; margin-top:12px; width:100%; font-size:1em; }
  button.mic { background:#3466d6; color:#fff; }
  table { width:100%; border-collapse:collapse; margin-top:12px; font-size:0.85em; }
  th, td { padding:6px; text-align:center; border-bottom:1px solid #2a4570; }
  .z0 { background:#7a0d0d; } .z1 { background:#b23c17; } .z2 { background:#c97a1a; }
  .z3 { background:#c9b41a; color:#111; } .z4 { background:#4c9a2a; } .z5 { background:#1a7a5e; }
  .z6 { background:#1a5fc9; }
  #status { text-align:center; color:#8fd3ff; min-height:20px; }
  canvas { background:#0e2246; border-radius:8px; }
</style>
</head>
<body>

<h1>Control de Tiempos de Natacion</h1>

<div class="card">
  <label>Nombre del nadador</label>
  <input id="nombre" type="text" placeholder="Dicta o escribe el nombre">

  <label>Prueba</label>
  <select id="prueba">
    <option value="1500">1500 metros</option>
    <option value="800">800 metros</option>
    <option value="400">400 metros</option>
    <option value="200">200 metros</option>
    <option value="100">100 metros</option>
    <option value="50">50 metros (superficie / espalda / apnea)</option>
  </select>

  <label>Record Nacional (segundos)</label>
  <input id="recNac" type="number" step="0.01" placeholder="Ej: 245.30">
  <label>Record Mundial (segundos)</label>
  <input id="recMun" type="number" step="0.01" placeholder="Ej: 230.10">
  <label>Record Personal (segundos)</label>
  <input id="recPer" type="number" step="0.01" placeholder="Ej: 250.00">

  <button class="mic" onclick="dictarNombre()">Dictar nombre por voz</button>
  <button class="mic" onclick="dictarTiempos()">Dictar los 10 tiempos por voz</button>
  <div id="status"></div>
</div>

<div class="card">
  <h3 style="color:#c9a24a; margin-top:0;">Tiempos por carrera (segundos)</h3>
  <div id="carreras"></div>
  <button onclick="calcular()">Calcular resultados</button>
</div>

<div class="card" id="resultados" style="display:none;">
  <h3 style="color:#c9a24a; margin-top:0;">Resultados</h3>
  <div id="tablaResultados"></div>
</div>

<div class="card">
  <h3 style="color:#c9a24a; margin-top:0;">Grafica de progreso</h3>
  <canvas id="grafico" width="320" height="200"></canvas>
</div>

<script>
const cont = document.getElementById('carreras');
for (let i=1;i<=10;i++){
  const lbl = document.createElement('label');
  lbl.textContent = 'Race ' + i;
  const row = document.createElement('div');
  row.style.display = 'flex';
  row.style.gap = '8px';
  row.style.alignItems = 'center';
  const inp = document.createElement('input');
  inp.type = 'number';
  inp.step = '0.01';
  inp.id = 'race'+i;
  inp.style.flex = '1';
  const micBtn = document.createElement('button');
  micBtn.type = 'button';
  micBtn.className = 'mic';
  micBtn.style.width = 'auto';
  micBtn.style.marginTop = '4px';
  micBtn.style.padding = '10px 14px';
  micBtn.textContent = String.fromCodePoint(0x1F3A4);
  micBtn.onclick = function(){ dictarUnaCarrera(i); };
  row.appendChild(inp);
  row.appendChild(micBtn);
  cont.appendChild(lbl);
  cont.appendChild(row);
}

function dictarUnaCarrera(numero){
  const rec = getRecognition();
  if (!rec) return;
  document.getElementById('status').textContent = 'Dicta el tiempo de la carrera ' + numero + '...';
  rec.start();
  rec.onresult = (e)=>{
    const texto = e.results[0][0].transcript.replace(',', '.').replace(/[^0-9.]/g,'');
    document.getElementById('race'+numero).value = texto;
    document.getElementById('status').textContent = 'Carrera ' + numero + ' capturada: ' + texto;
  };
  rec.onerror = (e)=>{
    document.getElementById('status').textContent = 'Error de microfono: ' + e.error + '. Debes abrir esta pagina desde un link https, no como archivo local.';
  };
}

function getZonaColor(pct){
  if (pct >= 100) return 'z6';
  if (pct >= 97) return 'z5';
  if (pct >= 94) return 'z4';
  if (pct >= 90) return 'z3';
  if (pct >= 85) return 'z2';
  if (pct >= 80) return 'z1';
  return 'z0';
}

function calcular(){
  const prueba = document.getElementById('prueba').value;
  const tiempos = [];
  for (let i=1;i<=10;i++){
    const v = parseFloat(document.getElementById('race'+i).value);
    if (!isNaN(v)) tiempos.push(v);
  }
  if (tiempos.length === 0){
    document.getElementById('status').textContent = 'Ingresa al menos un tiempo de carrera.';
    return;
  }
  const promedio = tiempos.reduce((a,b)=>a+b,0) / tiempos.length;

  let tiempoPro;
  if (prueba === '1500' || prueba === '800'){
    tiempoPro = promedio + 6;
  } else if (prueba === '400'){
    tiempoPro = promedio;
  } else if (prueba === '200' || prueba === '100'){
    tiempoPro = promedio - 6;
  } else if (prueba === '50'){
    tiempoPro = (promedio - 15) / 2;
  }

  const recNac = parseFloat(document.getElementById('recNac').value) || null;
  const recMun = parseFloat(document.getElementById('recMun').value) || null;
  const recPer = parseFloat(document.getElementById('recPer').value) || null;

  function comparar(nombreRec, record){
    if (!record) return null;
    const pct = (record / tiempoPro) * 100;
    return {nombre: nombreRec, record, pct: pct.toFixed(2), zona: getZonaColor(pct)};
  }

  const comparaciones = [
    comparar('Record Nacional', recNac),
    comparar('Record Mundial', recMun),
    comparar('Record Personal', recPer)
  ].filter(c => c !== null);

  let html = '<table><tr><th>Referencia</th><th>Record (s)</th><th>Tiempo Pro (s)</th><th>Porcentaje</th></tr>';
  comparaciones.forEach(c=>{
    html += `<tr class="${c.zona}"><td>${c.nombre}</td><td>${c.record.toFixed(2)}</td><td>${tiempoPro.toFixed(2)}</td><td>${c.pct}%</td></tr>`;
  });
  html += '</table>';
  html += `<p style="text-align:center; margin-top:10px;">Promedio de las 10 carreras: <b>${promedio.toFixed(2)}</b> seg. Tiempo Pro proyectado: <b>${tiempoPro.toFixed(2)}</b> seg.</p>`;

  document.getElementById('tablaResultados').innerHTML = html;
  document.getElementById('resultados').style.display = 'block';

  dibujarGrafico(tiempos);
}

function dibujarGrafico(tiempos){
  const canvas = document.getElementById('grafico');
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const max = Math.max(...tiempos);
  const min = Math.min(...tiempos);
  const rango = (max - min) || 1;
  ctx.strokeStyle = '#c9a24a';
  ctx.lineWidth = 2;
  ctx.beginPath();
  tiempos.forEach((t,i)=>{
    const x = 20 + i * ((canvas.width-40) / (tiempos.length-1||1));
    const y = canvas.height - 20 - ((t - min) / rango) * (canvas.height - 40);
    if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    ctx.fillStyle = '#8fd3ff';
    ctx.fillRect(x-2,y-2,4,4);
  });
  ctx.stroke();
}

function getRecognition(){
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition){
    document.getElementById('status').textContent = 'Este navegador no soporta dictado por voz. Usa Chrome en Android.';
    return null;
  }
  const rec = new SpeechRecognition();
  rec.lang = 'es-ES';
  rec.interimResults = false;
  rec.maxAlternatives = 1;
  return rec;
}

function dictarNombre(){
  const rec = getRecognition();
  if (!rec) return;
  document.getElementById('status').textContent = 'Escuchando el nombre...';
  rec.start();
  rec.onresult = (e)=>{
    document.getElementById('nombre').value = e.results[0][0].transcript;
    document.getElementById('status').textContent = 'Nombre capturado.';
  };
  rec.onerror = (e)=>{
    document.getElementById('status').textContent = 'Error de microfono: ' + e.error + '. Debes abrir esta pagina desde un link https, no como archivo local.';
  };
}

let carreraActual = 1;
function dictarTiempos(){
  carreraActual = 1;
  dictarSiguienteCarrera();
}
function dictarSiguienteCarrera(){
  if (carreraActual > 10){
    document.getElementById('status').textContent = 'Las 10 carreras fueron dictadas.';
    return;
  }
  const rec = getRecognition();
  if (!rec) return;
  document.getElementById('status').textContent = 'Dicta el tiempo de la carrera ' + carreraActual + '...';
  rec.start();
  rec.onresult = (e)=>{
    const texto = e.results[0][0].transcript.replace(',', '.').replace(/[^0-9.]/g,'');
    document.getElementById('race'+carreraActual).value = texto;
    carreraActual++;
    setTimeout(dictarSiguienteCarrera, 600);
  };
  rec.onerror = (e)=>{
    document.getElementById('status').textContent = 'Error de microfono: ' + e.error + '. Debes abrir esta pagina desde un link https, no como archivo local.';
  };
}
</script>
</body>
</html>
